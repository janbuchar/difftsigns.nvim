# https://git-cliff.org/docs/configuration
# Regenerated by .github/workflows/on_main.yml; manual_publish.yml cuts versions.

[changelog]
header = """
# Changelog

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
# A `refactor!:` still has to reach users even though refactors are skipped.
protect_breaking_commits = true
# The <!-- N --> prefixes only order the groups; striptags removes them.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^revert", group = "<!-- 4 -->Reverts" },
    # Includes the chore(changelog) and chore(release) commits the workflows make.
    { message = "^(chore|ci|refactor|style|test|build)", skip = true },
]
sort_commits = "oldest"

[bump]
initial_tag = "v0.1.0"
# Stay on 0.x until 1.0.0 is tagged by hand; a breaking change bumps minor.
breaking_always_bump_major = false
